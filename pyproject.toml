[project]
name = "pv-agent"
version = "3.0.0"
description = "Pharmacovigilance agent over live regulatory and biomedical APIs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "langchain-openai>=1.6.3",
    "langgraph>=1.2.12",
    "tavily-python>=0.8.4",
    "pypdf>=6.19.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
pv = "pv_agent.chat:main"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pv_agent"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
